apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-app
  namespace: nwsdb-prod
spec:
  replicas: 2
  selector:
    matchLabels: { app: client-app }
  template:
    metadata:
      labels: { app: client-app }
    spec:
      containers:
        - name: client-app
          image: nwsdbregistry.azurecr.io/client-app:1.0.0
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: client-svc
  namespace: nwsdb-prod
spec:
  selector: { app: client-app }
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nwsdb-ingress
  namespace: nwsdb-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["portal.nwsdb.lk"]
      secretName: nwsdb-tls
  rules:
    - host: portal.nwsdb.lk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: client-svc, port: { number: 80 } } }
