name: NWSDB SOC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NWSDB-SOC.sln

      - name: Build
        run: dotnet build NWSDB-SOC.sln --no-restore -c Release

      - name: Run unit and integration tests
        run: dotnet test NWSDB-SOC.sln --no-build -c Release --logger "trx" --results-directory ./TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults

  build-container-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Payment Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/PaymentService
          push: false
          tags: nwsdb-payment-service:assignment

      - name: Build Usage Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/UsageService
          push: false
          tags: nwsdb-usage-service:assignment

      - name: Build Client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: nwsdb-client:assignment
