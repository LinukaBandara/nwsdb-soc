name: NWSDB SOC CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NWSDB-SOC.sln

      - name: Build
        run: dotnet build NWSDB-SOC.sln --no-restore -c Release

      - name: Run unit & integration tests
        run: dotnet test NWSDB-SOC.sln --no-build -c Release --logger "trx" --results-directory ./TestResults

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults

  build-and-push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: nwsdbregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push Payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/PaymentService
          push: true
          tags: nwsdbregistry.azurecr.io/payment-service:${{ github.sha }}

      - name: Build & push Usage Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/UsageService
          push: true
          tags: nwsdbregistry.azurecr.io/usage-service:${{ github.sha }}

      - name: Build & push Client App
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: nwsdbregistry.azurecr.io/client-app:${{ github.sha }}

  deploy:
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "kubectl apply -f deployment/k8s/ (configured with cluster credentials in production)"
